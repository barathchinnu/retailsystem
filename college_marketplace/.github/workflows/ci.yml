name: College Marketplace CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: college_marketplace/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: college_marketplace/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check server.js

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend files
        run: |
          test -f college_marketplace/frontend/index.html
          echo "Frontend files found successfully"
